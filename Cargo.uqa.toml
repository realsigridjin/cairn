# UQA-RS checkout manifest. Use this file only after installing this crate at
# uqa-rs/integrations/cairn; it pins the sibling crates under ../../crates.
[package]
name = "cairn-uqa"
version = "1.0.0"
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"
description = "Revisioned object-store-native RAG runtime with OpenRouter embeddings, optional UQA-RS warm execution, and native DeepSeek Harness integration"
autobins = false

[lib]
name = "cairn_uqa"
path = "src/lib.rs"


[[bin]]
name = "cairn"
path = "src/bin/cairn/main.rs"

[features]
default = []
uqa = ["dep:uqa-engine", "dep:uqa-core"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["json"] }
bincode = "1.3"
bytes = "1"
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
crc32fast = "1"
dashmap = "6"
futures = "0.3"
fs2 = "0.4"
half = { version = "2", features = ["serde"] }
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["trace", "request-id"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
zstd = "0.13"

# This crate is designed to live at uqa-rs/integrations/cairn.
# Keep the dependency path explicit so the integration is pinned to the checked-out UQA tree.
uqa-engine = { path = "../../crates/uqa-engine", optional = true }
uqa-core = { path = "../../crates/uqa-core", optional = true }

[dev-dependencies]
rand = "0.9"

# Keep this integration as a standalone workspace even when checked out under
# the UQA-RS repository; UQA-RS does not list integrations/cairn as a member.
[workspace]
resolver = "2"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
