# Override the installed default row by id. Restate the complete config.
- id: cairn-uqa-retrieval
  config:
    baseUrl: https://cairn.internal.example
    tenant: acme
    knowledgeBase: product-docs
    toolName: search_product_docs
    tokenEnv: CAIRN_SERVER_TOKEN
    defaultLimit: 6
    maxLimit: 12
    candidateMultiplier: 12
    maxCandidateLimit: 2000
    timeoutMs: 30000
    retries: 1
    maxRetryDelayMs: 2000
    maxResponseBytes: 8388608
    maxTextCharsPerHit: 4000
    maxTotalTextChars: 16000
    maxMetadataBytesPerHit: 8192
    metadataKeys: [title, source, path, url, page, section, lang]
    fixedFiltersJson: '{"visibility":"agent"}'
    allowModelFilters: false
    healthCheckOnLoad: false

# A second KB uses a unique Cordis id and tool name.
- insert:
    - id: cairn-runbooks
      name: cairn-uqa-dsh
      config:
        baseUrl: https://cairn.internal.example
        tenant: acme
        knowledgeBase: runbooks
        toolName: search_runbooks
        tokenEnv: CAIRN_SERVER_TOKEN
        defaultLimit: 5
        maxLimit: 8
        candidateMultiplier: 16
        maxCandidateLimit: 2000
        timeoutMs: 30000
        retries: 1
        maxRetryDelayMs: 2000
        maxResponseBytes: 8388608
        maxTextCharsPerHit: 5000
        maxTotalTextChars: 16000
        maxMetadataBytesPerHit: 8192
        metadataKeys: [title, source, path, section]
        fixedFiltersJson: '{"visibility":"agent"}'
        allowModelFilters: false
        healthCheckOnLoad: false
