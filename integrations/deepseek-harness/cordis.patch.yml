# Safe local defaults. Override this complete row by id in a profile-owned
# cordis.patch.yml for remote URLs, alternate scopes, token variable names, or
# fixed authorization filters. Do not derive credential destinations from a
# project/invocation .env.
- insert:
    - id: cairn-uqa-retrieval
      name: cairn-uqa-dsh
      config:
        baseUrl: http://127.0.0.1:8080
        tenant: acme
        knowledgeBase: handbook
        toolName: cairn_search
        tokenEnv: CAIRN_SERVER_TOKEN
        defaultLimit: 6
        maxLimit: 12
        candidateMultiplier: 12
        maxCandidateLimit: 2000
        timeoutMs: 30000
        retries: 1
        maxRetryDelayMs: 2000
        maxResponseBytes: 8388608
        maxTextCharsPerHit: 4000
        maxTotalTextChars: 16000
        maxMetadataBytesPerHit: 8192
        metadataKeys: [title, source, path, url, page, section, lang]
        fixedFiltersJson: '{}'
        allowModelFilters: true
        healthCheckOnLoad: false
